<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GATE 2027 Math | Module 3: Discrete Mathematics (100 Problems: 50 Learn + 50 Practice)</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.css">
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/katex.min.js"></script>
  <script defer src="https://cdn.jsdelivr.net/npm/katex@0.16.9/dist/contrib/auto-render.min.js"></script>
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@400;600&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="data_module3_discrete_mathematics.js"></script>
  
  <style>
    :root {
      --bg-primary: #0a0e17;
      --bg-secondary: #121826;
      --bg-card: #182234;
      --accent-amber: #f59e0b;
      --accent-cyan: #06b6d4;
      --accent-rose: #f43f5e;
      --accent-blue: #3b82f6;
      --accent-green: #10b981;
      --text-main: #f1f5f9;
      --text-muted: #94a3b8;
      --border-color: #24324a;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background-color: var(--bg-primary);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }
    header {
      background: rgba(18, 24, 38, 0.98);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid var(--border-color);
      padding: 16px 32px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      position: sticky;
      top: 0;
      z-index: 50;
    }
    .brand-group { display: flex; align-items: center; gap: 14px; }
    .badge-pill {
      background: linear-gradient(135deg, #f59e0b, #ef4444);
      color: white; font-size: 0.75rem; font-weight: 700;
      padding: 4px 10px; border-radius: 9999px; text-transform: uppercase;
    }
    .header-title { font-size: 1.15rem; font-weight: 700; color: #f8fafc; }
    .header-subtitle { font-size: 0.8rem; color: var(--text-muted); }
    .tab-switcher {
      display: flex;
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 10px;
      padding: 4px;
      gap: 4px;
    }
    .tab-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 8px 16px;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s;
    }
    .tab-btn.active {
      background: var(--accent-amber);
      color: #451a03;
      box-shadow: 0 2px 8px rgba(245, 158, 11, 0.4);
    }
    .tab-btn.practice-tab.active {
      background: var(--accent-cyan);
      color: #082f49;
      box-shadow: 0 2px 8px rgba(6, 182, 212, 0.4);
    }
    .container {
      max-width: 1200px;
      margin: 0 auto;
      padding: 24px;
      flex: 1;
      width: 100%;
    }
    .filter-toolbar {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 12px;
      padding: 14px 20px;
      margin-bottom: 24px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 16px;
    }
    .search-box {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 14px;
      color: var(--text-main);
      font-size: 0.9rem;
      width: 260px;
      outline: none;
    }
    .subtopic-select {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 8px 14px;
      color: var(--text-main);
      font-size: 0.9rem;
      outline: none;
    }
    .stat-tracker { font-size: 0.85rem; color: var(--text-muted); font-weight: 500; }
    .problem-card {
      background: var(--bg-secondary);
      border: 1px solid var(--border-color);
      border-radius: 14px;
      padding: 26px;
      margin-bottom: 20px;
      box-shadow: 0 4px 20px rgba(0,0,0,0.2);
    }
    .problem-card:hover { border-color: rgba(245, 158, 11, 0.5); }
    .problem-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      flex-wrap: wrap;
      gap: 8px;
    }
    .problem-tags { display: flex; gap: 8px; align-items: center; }
    .pill {
      font-size: 0.75rem; font-weight: 700; padding: 3px 8px; border-radius: 6px;
      text-transform: uppercase; letter-spacing: 0.05em;
    }
    .pill-id { background: rgba(245, 158, 11, 0.15); color: #fbbf24; border: 1px solid rgba(245, 158, 11, 0.3); }
    .pill-subtopic { background: rgba(6, 182, 212, 0.15); color: #22d3ee; border: 1px solid rgba(6, 182, 212, 0.3); }
    .pill-source { background: rgba(59, 130, 246, 0.15); color: #60a5fa; border: 1px solid rgba(59, 130, 246, 0.3); }
    .pill-marks { background: rgba(16, 185, 129, 0.15); color: #34d399; border: 1px solid rgba(16, 185, 129, 0.3); }
    .statement-box { font-size: 1.05rem; line-height: 1.7; color: #f1f5f9; margin-bottom: 16px; }
    .options-grid {
      display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 10px; margin-bottom: 16px;
    }
    .option-cell { background: var(--bg-card); border: 1px solid var(--border-color); border-radius: 8px; padding: 10px 14px; font-size: 0.95rem; }
    .btn-action-group { display: flex; gap: 12px; margin-top: 14px; flex-wrap: wrap; }
    .btn {
      background: var(--bg-card); border: 1px solid var(--border-color); color: var(--text-main);
      padding: 8px 16px; border-radius: 8px; font-size: 0.85rem; font-weight: 600; cursor: pointer;
      display: inline-flex; align-items: center; gap: 6px; transition: all 0.2s;
    }
    .btn:hover { background: var(--border-color); color: white; }
    .btn-learn { background: linear-gradient(135deg, #f59e0b, #d97706); border: none; color: white; }
    .btn-learn:hover { background: linear-gradient(135deg, #fbbf24, #f59e0b); }
    .btn-hint { background: rgba(6, 182, 212, 0.15); border: 1px solid rgba(6, 182, 212, 0.4); color: #22d3ee; }
    .btn-answer { background: rgba(16, 185, 129, 0.15); border: 1px solid rgba(16, 185, 129, 0.4); color: #34d399; }
    
    .hidden-drawer {
      display: none; margin-top: 14px; border-radius: 10px; padding: 18px 20px;
      animation: fadeIn 0.25s forwards;
    }
    .hidden-drawer.open { display: block; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
    .drawer-solution { background: #0b1324; border: 1px solid rgba(245, 158, 11, 0.3); }
    .drawer-hint { background: rgba(6, 182, 212, 0.08); border: 1px solid rgba(6, 182, 212, 0.3); }
    .drawer-answer { background: rgba(16, 185, 129, 0.08); border: 1px solid rgba(16, 185, 129, 0.3); }
    .shortcut-badge {
      background: rgba(59, 130, 246, 0.15); border: 1px solid rgba(59, 130, 246, 0.3);
      color: #60a5fa; padding: 10px 14px; border-radius: 8px; margin-bottom: 12px; font-size: 0.9rem;
    }
    .answer-badge {
      display: inline-block; background: var(--accent-amber); color: #451a03; font-weight: 800;
      padding: 4px 12px; border-radius: 6px; font-size: 0.85rem; margin-bottom: 10px;
    }
    .solution-text { font-size: 0.95rem; line-height: 1.7; color: #cbd5e1; }
    footer {
      border-top: 1px solid var(--border-color); padding: 20px 32px;
      display: flex; justify-content: space-between; font-size: 0.85rem; color: var(--text-muted);
      background: rgba(10, 14, 23, 0.98);
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-group">
      <span class="badge-pill">GATE 2027</span>
      <div>
        <div class="header-title">Module 3: Discrete Mathematics — Master Problem Suite (100 Problems)</div>
        <div class="header-subtitle">CS Section 1 Pillar &amp; DA Logic/Graph Foundations</div>
      </div>
    </div>

    <div class="tab-switcher">
      <button class="tab-btn active" id="tabLearn" onclick="switchMode('learn')">
        📖 Learn Zone (50 Solved)
      </button>
      <button class="tab-btn practice-tab" id="tabPractice" onclick="switchMode('practice')">
        🎯 Practice Zone (50 Problems)
      </button>
    </div>
  </header>

  <div class="container">

    <div class="filter-toolbar">
      <div style="display: flex; gap: 12px; align-items: center; flex-wrap: wrap;">
        <input type="text" id="searchInput" class="search-box" placeholder="Search logic, graphs, posets..." oninput="renderProblems()">
        <select id="subtopicFilter" class="subtopic-select" onchange="renderProblems()">
          <option value="ALL">All Subtopics</option>
          <option value="Logic">Propositional &amp; First-Order Logic</option>
          <option value="Planar">Planar Graphs</option>
          <option value="Coloring">Graph Coloring</option>
          <option value="Eulerian">Eulerian &amp; Hamiltonian Graphs</option>
          <option value="Lattices">Posets &amp; Lattices</option>
          <option value="Equivalence">Equivalence Relations</option>
          <option value="Group">Abstract Algebra &amp; Groups</option>
          <option value="Recurrence">Recurrence Relations &amp; Generating Functions</option>
        </select>
      </div>

      <div class="stat-tracker" id="statTracker">Showing Problems</div>
    </div>

    <div id="problemsContainer"></div>

  </div>

  <footer>
    <div>Module 3: Discrete Mathematics • Authentic GATE Question Suite</div>
    <div>GATE 2027 Master Suite</div>
  </footer>

  <script>
    let currentMode = 'learn';

    function switchMode(mode) {
      currentMode = mode;
      document.getElementById('tabLearn').classList.toggle('active', mode === 'learn');
      document.getElementById('tabPractice').classList.toggle('active', mode === 'practice');
      renderProblems();
    }

    function toggleDrawer(drawerId, btn) {
      const el = document.getElementById(drawerId);
      if (!el) return;
      const isOpen = el.classList.contains('open');
      if (isOpen) {
        el.classList.remove('open');
        btn.innerHTML = btn.getAttribute('data-closed-text') || 'View';
      } else {
        el.classList.add('open');
        btn.innerHTML = btn.getAttribute('data-open-text') || 'Hide';
        if (window.renderMathInElement) {
          renderMathInElement(el, {
            delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}],
            throwOnError: false
          });
        }
      }
    }

    function renderProblems() {
      const container = document.getElementById('problemsContainer');
      const searchQuery = document.getElementById('searchInput').value.toLowerCase();
      const subtopicFilter = document.getElementById('subtopicFilter').value;

      const dataset = (currentMode === 'learn') ? module3_learn_problems : module3_practice_problems;

      const filtered = dataset.filter(p => {
        const matchesSearch = p.statement.toLowerCase().includes(searchQuery) ||
                              p.id.toLowerCase().includes(searchQuery) ||
                              p.subtopic.toLowerCase().includes(searchQuery);
        const matchesSubtopic = (subtopicFilter === 'ALL') || p.subtopic.includes(subtopicFilter);
        return matchesSearch && matchesSubtopic;
      });

      document.getElementById('statTracker').textContent = `Showing ${filtered.length} of ${dataset.length} Problems (${currentMode === 'learn' ? 'Learn Zone' : 'Practice Zone'})`;

      if (filtered.length === 0) {
        container.innerHTML = `
          <div style="text-align: center; padding: 48px; color: var(--text-muted); background: var(--bg-secondary); border-radius: 12px; border: 1px solid var(--border-color);">
            No problems match your current search/filter.
          </div>
        `;
        return;
      }

      let html = '';
      filtered.forEach((p, idx) => {
        const optionsHtml = (p.options && p.options.length > 0) ? `
          <div class="options-grid">
            ${p.options.map(opt => `<div class="option-cell">${opt}</div>`).join('')}
          </div>
        ` : '';

        if (currentMode === 'learn') {
          html += `
            <div class="problem-card" id="card-${p.id}">
              <div class="problem-header">
                <div class="problem-tags">
                  <span class="pill pill-id">${p.id}</span>
                  <span class="pill pill-subtopic">${p.subtopic}</span>
                  <span class="pill pill-source">${p.source}</span>
                  <span class="pill pill-marks">${p.marks} Mark${p.marks > 1 ? 's' : ''} • ${p.type}</span>
                </div>
              </div>

              <div class="statement-box">${p.statement}</div>
              ${optionsHtml}

              <div class="btn-action-group">
                <button class="btn btn-learn" data-closed-text="Show Full Solution 👁" data-open-text="Hide Solution ✕" onclick="toggleDrawer('sol-${p.id}', this)">
                  Show Full Solution 👁
                </button>
              </div>

              <div class="hidden-drawer drawer-solution" id="sol-${p.id}">
                <div><span class="answer-badge">Correct Answer: ${p.answer}</span></div>
                ${p.shortcut ? `<div class="shortcut-badge">⚡ <strong>10-Second Shortcut / Intuition:</strong> ${p.shortcut}</div>` : ''}
                <div class="solution-text">
                  <strong>Detailed Derivation:</strong><br>
                  ${p.solution.replace(/\\n/g, '<br>')}
                </div>
              </div>
            </div>
          `;
        } else {
          html += `
            <div class="problem-card" id="card-${p.id}">
              <div class="problem-header">
                <div class="problem-tags">
                  <span class="pill pill-id">${p.id}</span>
                  <span class="pill pill-subtopic">${p.subtopic}</span>
                  <span class="pill pill-source">${p.source}</span>
                  <span class="pill pill-marks">${p.marks} Mark${p.marks > 1 ? 's' : ''} • ${p.type}</span>
                </div>
              </div>

              <div class="statement-box">${p.statement}</div>
              ${optionsHtml}

              <div class="btn-action-group">
                <button class="btn btn-hint" data-closed-text="Show Hint 💡" data-open-text="Hide Hint ✕" onclick="toggleDrawer('hint-${p.id}', this)">
                  Show Hint 💡
                </button>
                <button class="btn btn-answer" data-closed-text="Reveal Answer 🎯" data-open-text="Hide Answer ✕" onclick="toggleDrawer('ans-${p.id}', this)">
                  Reveal Answer 🎯
                </button>
              </div>

              <div class="hidden-drawer drawer-hint" id="hint-${p.id}">
                <div style="color: #22d3ee; font-size: 0.95rem; line-height: 1.6;">
                  💡 <strong>Problem Hint:</strong> ${p.hint}
                </div>
              </div>

              <div class="hidden-drawer drawer-answer" id="ans-${p.id}">
                <div><span class="answer-badge" style="background: var(--accent-green); color: #022c22;">Final Answer: ${p.final_answer}</span></div>
                <div class="solution-text" style="color: #a7f3d0; margin-top: 6px;">
                  ${p.explanation}
                </div>
              </div>
            </div>
          `;
        }
      });

      container.innerHTML = html;

      if (window.renderMathInElement) {
        renderMathInElement(container, {
          delimiters: [{left: '$$', right: '$$', display: true}, {left: '$', right: '$', display: false}],
          throwOnError: false
        });
      }
    }

    document.addEventListener('DOMContentLoaded', () => {
      renderProblems();
    });
  </script>
</body>
</html>
